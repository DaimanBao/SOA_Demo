
@if (authService.isLoggedIn()) {
  <header class="navbar">
    <a class="navbar-brand" routerLink="/dashboard">
      <span class="brand-icon">🎓</span>
      <span class="brand-text">
        <strong>SOA Demo</strong>
        <span>Hệ thống quản lý đề tài</span>
      </span>
    </a>

    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active">
        <span class="nav-icon">⌂</span>
        Dashboard
      </a>

      @if (authService.getUser()?.role === 'ADMIN') {
        <a routerLink="/sinhvien" routerLinkActive="active">
          <span class="nav-icon">♙</span>
          Sinh viên
        </a>
      }

      <a routerLink="/detai" routerLinkActive="active">
        <span class="nav-icon">▤</span>
        Đề tài
      </a>

      <a routerLink="/dangky" routerLinkActive="active">
        <span class="nav-icon">☑</span>
        Đăng ký
      </a>
    </nav>

    <div class="navbar-status">
      <span class="status-dot"></span>
      <span>Đã đăng nhập</span>
    </div>

    <div class="user-info">
      <div class="user-details">
        <strong>{{ authService.getUser()?.username }}</strong>
        <span class="role-badge">
          {{ authService.getUser()?.role }}
        </span>
      </div>

      <button class="logout-btn" (click)="logout()">
        Đăng xuất
      </button>
    </div>
  </header>
}

<main>
  <router-outlet />
</main>
